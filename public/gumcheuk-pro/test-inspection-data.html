<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검측프로 데이터 연동 점검 (개발용)</title>
<style>
  :root { --ok:#15803d; --ng:#b91c1c; --warn:#b45309; --muted:#6b7280;
          --border:#d7dee3; --head:#0f4d6b; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:20px; background:#f4f7f9; color:#1f2937;
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif; font-size:14px;
  }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  .warn-banner {
    background:#fef3c7; border:1px solid #fcd34d; color:#92400e;
    padding:10px 12px; border-radius:6px; margin-bottom:16px; font-size:0.85rem;
  }
  .summary { font-size:1rem; font-weight:700; padding:10px 12px; border-radius:6px;
    margin-bottom:14px; }
  .summary.ok { background:#dcfce7; color:var(--ok); border:1px solid #86efac; }
  .summary.ng { background:#fee2e2; color:var(--ng); border:1px solid #fca5a5; }
  section { background:#fff; border:1px solid var(--border); border-radius:6px;
    padding:12px 14px; margin-bottom:12px; }
  h2 { font-size:0.92rem; margin:0 0 8px; color:var(--head); }

  /* 통계 타일 */
  .stat-grid { display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
  .stat { border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:#fbfdfe; }
  .stat-label { font-size:0.72rem; color:var(--muted); display:block; margin-bottom:2px; }
  .stat-value { font-size:1.35rem; font-weight:700; line-height:1.1; }
  .stat.is-ok .stat-value { color:var(--ok); }
  .stat.is-ng .stat-value { color:var(--ng); }
  .stat.is-warn .stat-value { color:var(--warn); }

  /* 테스트 케이스 */
  .case { padding:3px 0; font-family:Consolas,monospace; font-size:0.8rem;
    border-bottom:1px solid #f1f5f9; }
  .case:last-child { border-bottom:none; }
  .tag { display:inline-block; width:44px; font-weight:700; }
  .pass .tag { color:var(--ok); }
  .fail .tag { color:var(--ng); }
  .fail { background:#fef2f2; }
  .detail { color:var(--muted); }

  /* 표 */
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:0.78rem; margin-top:6px; }
  th,td { border:1px solid var(--border); padding:4px 6px; text-align:left;
    vertical-align:top; }
  th { background:#f8fafc; white-space:nowrap; }
  .missing { color:var(--muted); font-style:italic; }
  .empty { color:#cbd5e1; }

  .badge { display:inline-block; font-size:0.68rem; font-weight:600; padding:1px 5px;
    border-radius:3px; background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .badge-legacy { background:#e0e7ff; color:#3730a3; border-color:#a5b4fc; }
  .badge-db { background:#cffafe; color:#155e75; border-color:#67e8f9; }

  .issue { font-family:Consolas,monospace; font-size:0.76rem; padding:3px 6px;
    border-left:3px solid var(--border); margin-bottom:3px; background:#fafafa; }
  .issue.e { border-left-color:var(--ng); background:#fef2f2; }
  .issue.w { border-left-color:var(--warn); background:#fffbeb; }
  .issue-code { font-weight:700; margin-right:6px; }
  .none { color:var(--muted); font-size:0.8rem; }

  .cat-grid { display:grid; gap:6px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .cat { border:1px solid var(--border); border-radius:5px; padding:6px 8px; }
  .cat-name { font-weight:700; font-size:0.82rem; }
  .cat-id { color:var(--muted); font-weight:400; font-size:0.72rem; }
  .cat ul { margin:4px 0 0; padding-left:16px; }
  .cat li { font-size:0.76rem; padding:1px 0; }
  .cat-empty { color:var(--muted); font-size:0.76rem; margin:4px 0 0; }

  select { font:inherit; padding:4px 6px; max-width:100%; }
  .picker-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .meta-table th { width:110px; }
  .hint { font-size:0.78rem; color:var(--muted); margin:6px 0 0; }
</style>
</head>
<body>

<h1>검측프로 데이터 연동 점검</h1>
<div class="warn-banner">
  <strong>개발용 페이지입니다.</strong>
  운영 화면(index.html)에는 포함되지 않습니다. 이 페이지는 데이터만 검사하며
  localStorage 를 읽거나 쓰지 않습니다.
  콘솔에서 <code>InspectionDataAdapter.runSelfTest()</code> 를 직접 실행할 수도 있습니다.
</div>

<div id="summary" class="summary">실행 중…</div>
<div id="results"></div>

<!--
  로딩 순서는 index.html 과 동일해야 한다.
  1) inspectionTemplates.js  2) inspectionDatabase.generated.js  3) inspectionDataAdapter.js
-->
<script src="inspectionTemplates.js"></script>
<script src="inspectionDatabase.generated.js"></script>
<script src="inspectionDataAdapter.js"></script>
<script>
(function () {
  "use strict";

  var out = document.getElementById("results");
  var pass = 0, fail = 0, current = null;

  function el(tag, className, text) {
    var d = document.createElement(tag);
    if (className) d.className = className;
    if (text !== undefined) d.textContent = text;
    return d;
  }
  function section(title) {
    current = el("section");
    current.appendChild(el("h2", null, title));
    out.appendChild(current);
    return current;
  }
  function check(name, cond, detail) {
    var d = el("div", "case " + (cond ? "pass" : "fail"));
    d.innerHTML = '<span class="tag">' + (cond ? "PASS" : "FAIL") + "</span>" +
      esc(name) +
      (detail && !cond ? ' <span class="detail">— ' + esc(String(detail)) + "</span>" : "");
    current.appendChild(d);
    if (cond) pass += 1; else fail += 1;
  }
  function note(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    current.appendChild(d);
  }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /** 빈 값은 회색 하이픈으로 보여준다. 빈 문자열과 누락을 눈으로 구분하려고. */
  function cell(v) {
    var s = String(v === null || v === undefined ? "" : v);
    return s.trim() ? esc(s) : '<span class="empty">-</span>';
  }
  function tableIn(parent, html) {
    var wrap = el("div", "table-wrap");
    var t = document.createElement("table");
    t.innerHTML = html;
    wrap.appendChild(t);
    parent.appendChild(wrap);
    return t;
  }

  var A = window.InspectionDataAdapter;
  var LEGACY = window.INSPECTION_DB_ADAPTER;   // 1차 연동 때의 이름. 하위호환 확인용.
  var DB = window.INSPECTION_DATABASE;

  /* ================= 1. 스크립트 로딩 ================= */
  section("1. 스크립트 로딩 / 전역 이름");
  check("inspectionTemplates.js (WORK_CATEGORIES)", typeof WORK_CATEGORIES !== "undefined");
  check("inspectionTemplates.js (SUB_WORK_TEMPLATES)", typeof SUB_WORK_TEMPLATES !== "undefined");
  check("inspectionDatabase.generated.js (INSPECTION_DATABASE)", !!DB);
  check("inspectionDataAdapter.js (InspectionDataAdapter)", !!A);
  check("하위호환 이름 INSPECTION_DB_ADAPTER 유지", !!LEGACY);

  if (!A) {
    document.getElementById("summary").className = "summary ng";
    document.getElementById("summary").textContent =
      "치명적 오류: InspectionDataAdapter 가 없습니다. 스크립트 로딩 순서를 확인하세요.";
    return;
  }

  var api = ["getAllCategories", "getAllTemplates", "getTemplatesByCategory", "getTemplateById",
             "validateDatabase", "getStatistics", "normalizeLegacyTemplate",
             "normalizeDatabaseTemplate", "getSourceInformation", "runSelfTest"];
  api.forEach(function (name) {
    check("API " + name + "()", typeof A[name] === "function");
  });
  check("DB 템플릿 주입 성공", A.available === true, A.reason);

  /* ================= 2. 통계 ================= */
  var stats = A.getStatistics();
  var validation = A.validateDatabase();
  var templates = A.getAllTemplates();
  var categories = A.getAllCategories();

  var sec = section("2. 데이터 통계");
  var grid = el("div", "stat-grid");
  [
    ["전체 카테고리", stats.categoryCount, ""],
    ["전체 템플릿", stats.templateCount, ""],
    ["전체 검사항목", stats.itemCount, ""],
    ["기존 템플릿", stats.legacyTemplateCount, ""],
    ["DB 템플릿", stats.databaseTemplateCount, ""],
    ["기존 검사항목", stats.legacyItemCount, ""],
    ["DB 검사항목", stats.databaseItemCount, ""],
    ["오류", stats.errorCount, stats.errorCount ? "is-ng" : "is-ok"],
    ["경고", stats.warningCount, stats.warningCount ? "is-warn" : "is-ok"],
    ["제외된 템플릿", stats.excludedTemplateCount, stats.excludedTemplateCount ? "is-ng" : "is-ok"],
    ["자동 보정", stats.repairedTemplateCount, stats.repairedTemplateCount ? "is-warn" : "is-ok"],
    ["기준 누락 항목", stats.missingCriteriaItemCount, stats.missingCriteriaItemCount ? "is-warn" : ""],
  ].forEach(function (row) {
    var box = el("div", "stat " + row[2]);
    box.appendChild(el("span", "stat-label", row[0]));
    box.appendChild(el("span", "stat-value", String(row[1])));
    grid.appendChild(box);
  });
  sec.appendChild(grid);
  note('<p class="hint">전체 템플릿 = 기존 템플릿 + DB 템플릿. ' +
       '검증에서 제외된 DB 템플릿은 앱에도 노출되지 않으므로 전체 수에 포함되지 않습니다.</p>');

  /* ================= 3. 검증 결과 ================= */
  var sec3 = section("3. 데이터 검증 결과 (validateDatabase)");
  check("검증 결과에 valid/errors/warnings/summary 존재",
    typeof validation.valid === "boolean" &&
    Array.isArray(validation.errors) &&
    Array.isArray(validation.warnings) &&
    validation.summary && typeof validation.summary === "object");
  check("summary 필드 5종",
    ["categoryCount", "templateCount", "itemCount", "legacyTemplateCount", "databaseTemplateCount"]
      .every(function (k) { return typeof validation.summary[k] === "number"; }),
    JSON.stringify(validation.summary));
  check("오류 없음", validation.errors.length === 0, validation.errors.length + "건");
  check("valid === (오류 0건)", validation.valid === (validation.errors.length === 0));

  function issueList(parent, title, items, cls) {
    parent.appendChild(el("p", "hint", title + " " + items.length + "건"));
    if (!items.length) {
      parent.appendChild(el("p", "none", "없음"));
      return;
    }
    items.forEach(function (i) {
      var d = el("div", "issue " + cls);
      d.innerHTML = '<span class="issue-code">' + esc(i.code) + "</span>" +
        "<span>" + esc(i.scope) + ":" + esc(i.targetId) + " — " + esc(i.message) + "</span>";
      parent.appendChild(d);
    });
  }
  issueList(sec3, "오류", validation.errors, "e");
  issueList(sec3, "경고", validation.warnings, "w");
  sec3.appendChild(el("p", "hint",
    "제외된 템플릿: " + (validation.excludedTemplateIds.join(", ") || "없음")));
  sec3.appendChild(el("p", "hint",
    "자동 보정된 템플릿(공종 대체): " + (validation.repairedTemplateIds.join(", ") || "없음")));

  /* ================= 4. 기존 데이터 보존 (회귀 방지) ================= */
  section("4. 기존 데이터 보존 (회귀 방지)");
  check("공종 18개 유지", categories.length === 18, categories.length);
  var catNames = categories.map(function (c) { return c.name; });
  check("공종 이름 중복 없음", new Set(catNames).size === catNames.length);
  var catIds = categories.map(function (c) { return c.id; });
  check("공종 id 중복 없음", new Set(catIds).size === catIds.length);

  check("기존 템플릿 19개 유지", stats.legacyTemplateCount === 19, stats.legacyTemplateCount);
  check("DB 템플릿 3개", stats.databaseTemplateCount === 3, stats.databaseTemplateCount);
  check("전체 템플릿 22개", templates.length === 22, templates.length);
  var ids = templates.map(function (t) { return t.id; });
  check("템플릿 id 중복 없음", new Set(ids).size === ids.length);

  check("SUB_WORK_TEMPLATES 원본 배열도 22건", SUB_WORK_TEMPLATES.length === 22,
    SUB_WORK_TEMPLATES.length);
  check("기존 CO-01 살아있음", !!A.getTemplateById("CO-01"));
  check("기존 CO-01 검사기준 원문 보존",
    A.getTemplateById("CO-01").items[0].inspectionCriteria === "설계도면 두께(통상 50~100mm) 이내",
    A.getTemplateById("CO-01").items[0].inspectionCriteria);
  check("기존 템플릿의 items 는 손대지 않음(item/standard 유지)",
    getSubWorkTemplate("CO-01").items[0].item === "버림콘크리트 두께" &&
    typeof getSubWorkTemplate("CO-01").items[0].standard === "string");

  /* ================= 5. 표준 구조 ================= */
  section("5. 표준 템플릿 구조");
  var REQ_T = ["id", "categoryId", "categoryName", "templateName", "subCategory",
               "sourceType", "sourceFile", "inspectionStage", "items"];
  var REQ_I = ["id", "sequence", "inspectionItem", "inspectionCriteria", "inspectionMethod",
               "reference", "timing", "responsibleParty", "requiredEvidence", "notes"];
  var structProblems = [];
  templates.forEach(function (t) {
    REQ_T.forEach(function (k) {
      if (!(k in t)) structProblems.push(t.id + "." + k + " 없음");
    });
    if (t.sourceType !== "legacy" && t.sourceType !== "database") {
      structProblems.push(t.id + ".sourceType=" + t.sourceType);
    }
    if (!Array.isArray(t.items)) structProblems.push(t.id + ".items 배열 아님");
    (t.items || []).forEach(function (it) {
      REQ_I.forEach(function (k) {
        if (!(k in it)) structProblems.push(t.id + "/" + it.id + "." + k + " 없음");
        else if (k === "sequence") {
          if (typeof it[k] !== "number") structProblems.push(t.id + "/" + it.id + ".sequence 숫자 아님");
        } else if (typeof it[k] !== "string") {
          structProblems.push(t.id + "/" + it.id + "." + k + " 문자열 아님");
        }
      });
    });
  });
  check("모든 템플릿·항목이 표준 필드를 갖춤", structProblems.length === 0,
    structProblems.slice(0, 5).join(" / "));
  check("sourceType 은 legacy 또는 database 뿐",
    templates.every(function (t) { return t.sourceType === "legacy" || t.sourceType === "database"; }));
  check("검사항목 합계가 통계와 일치",
    templates.reduce(function (n, t) { return n + t.items.length; }, 0) === stats.itemCount);

  section("6. 조회 함수 방어 동작");
  check("getTemplatesByCategory('rc') 3건",
    A.getTemplatesByCategory("rc").length === 3, A.getTemplatesByCategory("rc").length);
  check("getTemplatesByCategory('concrete') 4건",
    A.getTemplatesByCategory("concrete").length === 4, A.getTemplatesByCategory("concrete").length);
  check("없는 공종 → 빈 배열", A.getTemplatesByCategory("없는공종").length === 0);
  check("null/undefined → 빈 배열",
    A.getTemplatesByCategory(null).length === 0 && A.getTemplatesByCategory(undefined).length === 0);
  check("getTemplateById 없는 id → null", A.getTemplateById("없는코드") === null);
  check("getTemplateById(null) → null", A.getTemplateById(null) === null);
  check("getSourceInformation 없는 id → null", A.getSourceInformation("REF-NOPE") === null);
  check("normalizeLegacyTemplate(null) 도 표준 구조 반환",
    REQ_T.every(function (k) { return k in A.normalizeLegacyTemplate(null); }));
  check("normalizeDatabaseTemplate(null) 도 표준 구조 반환",
    REQ_T.every(function (k) { return k in A.normalizeDatabaseTemplate(null); }));
  check("validateDatabase(null) 은 예외 없이 valid:false",
    A.validateDatabase(null).valid === false && A.validateDatabase(null).errors.length > 0);

  /* ================= 7. 검사기준 취급 ================= */
  section("7. 검사기준 취급 (기준을 지어내지 않는가)");
  var dbTemplates = templates.filter(function (t) { return t.sourceType === "database"; });
  var dbAll = dbTemplates.reduce(function (acc, t) { return acc.concat(t.items); }, []);
  check("DB 검사항목 30건", dbAll.length === 30, dbAll.length);
  check("DB 원본에서 기준 누락 2건", stats.missingCriteriaItemCount === 2,
    stats.missingCriteriaItemCount);
  var blank = dbAll.filter(function (i) { return !i.inspectionCriteria; });
  check("기준 누락 항목의 inspectionCriteria 는 빈 문자열", blank.length === 2, blank.length);
  // 검증상태(unverified)는 표준 구조가 아니라 app 형식 항목에 실려 있다.
  var appItems = getSubWorkTemplate("DB-04-003").items;
  check("app 형식 항목의 verificationStatus === 'unverified'",
    appItems.every(function (i) { return i.verificationStatus === "unverified"; }));
  check("verified 로 표시된 항목 0건",
    appItems.filter(function (i) { return i.verificationStatus === "verified"; }).length === 0);

  /* ================= 8. 카테고리별 템플릿 목록 ================= */
  var sec8 = section("8. 카테고리별 템플릿 목록");
  var cg = el("div", "cat-grid");
  categories.forEach(function (c) {
    var box = el("div", "cat");
    var h = el("div", "cat-name");
    h.innerHTML = esc(c.name) + ' <span class="cat-id">(' + esc(c.id) + ")</span>";
    box.appendChild(h);
    var list = A.getTemplatesByCategory(c.id);
    if (!list.length) {
      box.appendChild(el("p", "cat-empty", "템플릿 없음"));
    } else {
      var ul = document.createElement("ul");
      list.forEach(function (t) {
        var li = document.createElement("li");
        li.innerHTML = esc(t.templateName) + " " +
          '<span class="badge ' + (t.sourceType === "database" ? "badge-db\">DB" : "badge-legacy\">기존") +
          "</span> " + t.items.length + "건";
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    cg.appendChild(box);
  });
  sec8.appendChild(cg);

  /* ================= 9. 템플릿 상세 (선택) ================= */
  var sec9 = section("9. 템플릿 상세 — 검사항목 전체 / 출처 / 기준·참조");
  var row = el("div", "picker-row");
  row.appendChild(el("label", null, "템플릿 선택"));
  var sel = document.createElement("select");
  sel.innerHTML = categories.map(function (c) {
    var list = A.getTemplatesByCategory(c.id);
    if (!list.length) return "";
    return '<optgroup label="' + esc(c.name) + '">' +
      list.map(function (t) {
        return '<option value="' + esc(t.id) + '">' +
          esc(t.templateName) + " · " + (t.sourceType === "database" ? "DB" : "기존") +
          " · " + t.items.length + "건</option>";
      }).join("") + "</optgroup>";
  }).join("");
  row.appendChild(sel);
  sec9.appendChild(row);
  var detail = el("div");
  sec9.appendChild(detail);

  function renderDetail(id) {
    detail.innerHTML = "";
    var t = A.getTemplateById(id);
    if (!t) {
      detail.appendChild(el("p", "none", "템플릿을 찾을 수 없습니다."));
      return;
    }
    var src = A.getSourceInformation(t.id) || {};
    var refs = Array.isArray(src.references) ? src.references : [];

    var head = el("div", "table-wrap");
    var mt = document.createElement("table");
    mt.className = "meta-table";
    mt.innerHTML =
      "<tr><th>템플릿 id</th><td>" + cell(t.id) + "</td></tr>" +
      "<tr><th>템플릿명</th><td>" + cell(t.templateName) + "</td></tr>" +
      "<tr><th>공종</th><td>" + cell(t.categoryName) + " (" + cell(t.categoryId) + ")</td></tr>" +
      "<tr><th>세부 구분</th><td>" + cell(t.subCategory) + "</td></tr>" +
      "<tr><th>데이터 원본 유형</th><td>" +
        '<span class="badge ' + (t.sourceType === "database" ? "badge-db\">database" : "badge-legacy\">legacy") +
        "</span></td></tr>" +
      "<tr><th>출처 파일</th><td>" + cell(t.sourceFile) + "</td></tr>" +
      "<tr><th>검측 단계</th><td>" + cell(t.inspectionStage) + "</td></tr>" +
      "<tr><th>검사항목 수</th><td>" + t.items.length + "</td></tr>" +
      "<tr><th>비고</th><td>" + cell(src.note) + "</td></tr>";
    head.appendChild(mt);
    detail.appendChild(head);

    if (refs.length) {
      detail.appendChild(el("p", "hint", "원본 문서 위치 및 원문"));
      tableIn(detail,
        "<tr><th>출처 id</th><th>파일</th><th>위치</th><th>원문</th></tr>" +
        refs.map(function (r) {
          var where = [r.section, r.sheetName, r.page != null ? "p." + r.page : "",
                       r.row != null ? "row " + r.row : "", r.cellRange]
            .filter(Boolean).join(" / ");
          return "<tr><td>" + cell(r.id) + "</td><td>" + cell(r.fileName) + "</td><td>" +
            cell(where) + "</td><td>" + cell(r.sourceText) + "</td></tr>";
        }).join(""));
    }

    detail.appendChild(el("p", "hint", "검사항목 전체 (표준 구조 그대로)"));
    tableIn(detail,
      "<tr><th>순번</th><th>id</th><th>검사항목</th><th>검사기준</th><th>검사방법</th>" +
      "<th>참조</th><th>시기</th><th>담당</th><th>필요 증빙</th><th>비고</th></tr>" +
      t.items.map(function (i) {
        var criteria = i.inspectionCriteria
          ? esc(i.inspectionCriteria)
          : '<span class="missing">원문에 기재 없음</span>';
        return "<tr><td>" + i.sequence + "</td><td>" + cell(i.id) + "</td><td>" +
          cell(i.inspectionItem) + "</td><td>" + criteria + "</td><td>" +
          cell(i.inspectionMethod) + "</td><td>" + cell(i.reference) + "</td><td>" +
          cell(i.timing) + "</td><td>" + cell(i.responsibleParty) + "</td><td>" +
          cell(i.requiredEvidence) + "</td><td>" + cell(i.notes) + "</td></tr>";
      }).join(""));

    if (t.sourceType === "database") {
      detail.appendChild(el("p", "hint",
        "검사방법·참조·담당은 원문(hwp/xls)에서 검사기준과 분리되어 있지 않아 비어 있습니다. " +
        "추측해서 채우지 않습니다."));
    }
  }

  sel.addEventListener("change", function () { renderDetail(sel.value); });
  if (sel.options.length) {
    sel.value = "DB-04-001";
    if (!sel.value) sel.selectedIndex = 0;
    renderDetail(sel.value);
  }

  /* ================= 10. 전체 검사항목 (한눈에) ================= */
  var sec10 = section("10. 전체 검사항목 " + stats.itemCount + "건");
  tableIn(sec10,
    "<tr><th>공종</th><th>템플릿</th><th>원본</th><th>순번</th><th>검사항목</th>" +
    "<th>검사기준</th><th>출처 파일</th></tr>" +
    templates.reduce(function (rows, t) {
      return rows.concat(t.items.map(function (i) {
        return "<tr><td>" + cell(t.categoryName) + "</td><td>" + cell(t.templateName) +
          '</td><td><span class="badge ' +
          (t.sourceType === "database" ? "badge-db\">DB" : "badge-legacy\">기존") +
          "</span></td><td>" + i.sequence + "</td><td>" + cell(i.inspectionItem) + "</td><td>" +
          (i.inspectionCriteria ? esc(i.inspectionCriteria)
                               : '<span class="missing">원문에 기재 없음</span>') +
          "</td><td>" + cell(t.sourceFile) + "</td></tr>";
      }));
    }, []).join(""));

  /* ================= 결과 ================= */
  section("11. 콘솔 자체 점검 (runSelfTest)");
  var self = A.runSelfTest();
  check("runSelfTest() 통과", self && self.ok === true,
    self && self.problems && self.problems.join(" / "));

  var s = document.getElementById("summary");
  s.className = "summary " + (fail === 0 ? "ok" : "ng");
  s.textContent = fail === 0
    ? "전체 통과 — " + pass + "건 / 데이터 오류 " + stats.errorCount +
      "건, 경고 " + stats.warningCount + "건"
    : "실패 " + fail + "건 / 통과 " + pass + "건";
})();
</script>

</body>
</html>
